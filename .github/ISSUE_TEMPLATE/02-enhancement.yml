name: Suggest an improvement
description: Share an idea that would make the game or launcher better.
title: "[Enhancement]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Share one idea at a time. Check [existing suggestions](https://github.com/TheDoffman/timesplitters-future-perfect-pc/issues) first.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or change?
      placeholder: "Example: Let me change the text size in the menus."
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: You can attach a screenshot or example. Remove personal information and do not upload game files or saves.
  - type: textarea
    id: diagnostics
    attributes:
      label: Launcher diagnostics (optional)
      description: Open Diagnostics in the launcher and choose Report a bug or Request enhancement. If the launcher copied a longer report, paste the complete report here. Review before submitting; do not include private paths, raw logs, game files or saves.
      placeholder: Paste the filtered diagnostic report from the launcher here.
      render: text
