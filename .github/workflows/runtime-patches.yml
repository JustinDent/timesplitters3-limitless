# Superseded commits on the same PR/ref do not need to finish testing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch-transitions:
    name: Patch transitions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select affected test suites
        id: scope
        run: python tools/ci-runtime-scope.py
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependency = next(line for line in Path('requirements.txt').read_text().splitlines()
                            if line.startswith('pytest=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', dependency], check=True)
          PY
      - name: Check out pinned upstream source only
        if: steps.scope.outputs.transitions == 'true' || steps.scope.outputs.native == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nemonicicon/ts3FPrecomp
          ref: ${{ steps.pins.outputs.revision }}
          path: external/ts3FPrecomp
          persist-credentials: false
      - name: Test patch tracking, branch switches and historical upgrades
        if: steps.scope.outputs.transitions == 'true'
        run: python -m pytest tests/test_patch_tracking.py tests/test_patch_updates.py -q --tb=short
      - name: Apply shared runtime patches
        if: steps.scope.outputs.native == 'true'
        run: python tools/apply-patches.py external/ts3FPrecomp patches
      - name: Test native runtime, rendering and input regressions
        if: steps.scope.outputs.native == 'true'
        run: |
          tests=(
            tests/test_ci_runtime_scope.py
            tests/test_native_compiler.py tests/test_audio_timing.py
            tests/test_recomp_generation.py tests/test_framebuffer_sampling.py tests/test_ghost_rendering.py
            tests/test_xmv_stop.py
            tests/test_cutscene_letterbox.py tests/test_decal_projection.py
            tests/test_channel_clears.py tests/test_objectives_health.py
            tests/test_terminal_mouse.py tests/test_ui_layout.py
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            tests+=(tests/test_pc_display_modes.py tests/test_fov_settings.py)
          fi
          python -m pytest "${tests[@]}" -q --tb=short
      - name: Test release validation and disposable fixture cleanup
        if: steps.scope.outputs.release == 'true'
        run: python -m pytest tests/test_publish_release.py -q --tb=short
      - name: Build and test Windows release launcher
        if: runner.os == 'Windows' && steps.scope.outputs.launcher == 'true'
        shell: powershell
        run: ./tools/build-launcher.ps1 -Test
      - name: Test portable startup preference and launcher packaging
        if: runner.os == 'Windows' && steps.scope.outputs.launcher == 'true'
        run: python -m pytest tests/test_launcher_startup.py tests/package_launcher.py -q --tb=short
