name: Runtime patch transitions

on:
  push:
    paths:
      - .github/workflows/runtime-patches.yml
      - tools/recomp-generation.py
      - tests/test_recomp_generation.py
      - tools/apply-patches.py
      - tests/test_patch_updates.py
      - tests/test_patch_tracking.py
      - tests/test_audio_timing.py
      - tests/native_compiler.py
      - tests/test_pc_display_modes.py
      - tools/publish-release.py
      - tools/launcher/**
      - tools/build-launcher.ps1
      - tools/playable-launch.ps1
      - tests/launcher_updates.cs
      - tests/launcher_settings.cs
      - tests/test_launcher_startup.py
      - tests/package_launcher.py
      - tests/test_publish_release.py
      - tests/pc_display_modes.c
      - src/pc_display.c
      - tests/test_native_compiler.py
      - tests/test_framebuffer_sampling.py
      - tests/test_cutscene_letterbox.py
      - tests/cutscene_letterbox.c
      - src/pc_cutscene.h
      - src/pc_terminal.h
      - src/pc_input.c
      - src/pc_controls.c
      - src/native/input_sdl.c
      - tests/test_terminal_mouse.py
      - tests/terminal_mouse.c
      - src/pc_display_menu.c
      - tests/framebuffer_sampling.c
      - tests/audio_stream_timing.c
      - tests/audio_buffer_timing.c
      - patches/**
      - tsfp.ps1
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-transitions:
    name: Patch transitions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependency = next(line for line in Path('requirements.txt').read_text().splitlines()
                            if line.startswith('pytest=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', dependency], check=True)
          PY
      - name: Check out pinned upstream source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nemonicicon/ts3FPrecomp
          ref: ${{ steps.pins.outputs.revision }}
          path: external/ts3FPrecomp
          persist-credentials: false
      - name: Test patch tracking, branch switches and historical upgrades
        run: python -m pytest tests/test_patch_tracking.py tests/test_patch_updates.py -q --tb=short
      - name: Apply shared runtime patches
        run: python tools/apply-patches.py external/ts3FPrecomp patches
      - name: Test audio clocks, ADPCM resume and queue backpressure
        run: python -m pytest tests/test_native_compiler.py tests/test_audio_timing.py tests/test_recomp_generation.py -q --tb=short
      - name: Test framebuffer sampling across rendering passes
        run: python -m pytest tests/test_framebuffer_sampling.py -q --tb=short
      - name: Test adaptive cutscene letterboxing
        run: python -m pytest tests/test_cutscene_letterbox.py -q --tb=short
      - name: Test terminal mouse routing
        run: python -m pytest tests/test_terminal_mouse.py -q --tb=short
      - name: Test primary display resolution discovery
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_pc_display_modes.py -q --tb=short
      - name: Test release validation and disposable fixture cleanup
        run: python -m pytest tests/test_publish_release.py -q --tb=short
      - name: Build and test Windows release launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/build-launcher.ps1 -Test
      - name: Test portable startup preference and launcher packaging
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_launcher_startup.py tests/package_launcher.py -q --tb=short
